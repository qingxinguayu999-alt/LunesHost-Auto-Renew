name: Lunes Host keep-alive

on:
  schedule:
    # Every Wednesday at 03:17 UTC. Weekly execution stays inside the 15-day window.
    - cron: "17 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunes-host-keep-alive
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sign in to Lunes dashboard
        env:
          LUNES_EMAIL: ${{ secrets.LUNES_EMAIL }}
          LUNES_PASSWORD: ${{ secrets.LUNES_PASSWORD }}
        run: python renew.py
